<!DOCTYPE html>
<html lang="en">
<head>
<!-- skill:chrome -->
<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>
<!-- /skill:chrome -->
<meta charset="UTF-8">
<title>SeaFin icon generator</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f2e35;color:#eafcff;margin:0;padding:40px;text-align:center}
  h1{font-weight:600;font-size:22px}
  p{opacity:.75;font-size:14px;max-width:52ch;margin:8px auto 24px}
  .row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin:24px 0}
  .tile{background:#123f49;border-radius:16px;padding:16px}
  canvas{border-radius:12px;display:block}
  .tile div{font-size:12px;opacity:.7;margin-top:8px}
  button{background:#3aa7b8;color:#08262c;border:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:12px;cursor:pointer;margin-top:8px}
  code{background:#0b262c;padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
  <h1>SeaFin app icons</h1>
  <p>Click <b>Download all</b>, then move the four PNGs into <code>public/icons/</code>. The compass mark matches your brand logo.</p>
  <div class="row" id="tiles"></div>
  <button id="dl">Download all 4 icons</button>

  <script>
    // Draw the SeaFin compass-and-dollar mark at any size.
    function draw(ctx, size, maskable) {
      const teal = '#2a7d8c', tealDeep = '#123f49', tealLight = '#7fdfef'
      const gold = '#f2b83a', goldDeep = '#c9902a'
      // background
      const g = ctx.createLinearGradient(0, 0, 0, size)
      g.addColorStop(0, teal); g.addColorStop(1, tealDeep)
      ctx.fillStyle = g
      if (maskable) ctx.fillRect(0, 0, size, size)
      else { roundRect(ctx, 0, 0, size, size, size * 0.22); ctx.fill() }

      const pad = maskable ? size * 0.20 : size * 0.14
      const s = (size - pad * 2) / 100
      ctx.save(); ctx.translate(pad, pad); ctx.scale(s, s)
      const C = 50

      // compass ring
      ctx.strokeStyle = 'rgba(234,252,255,0.92)'; ctx.lineWidth = 3
      ctx.beginPath(); ctx.arc(C, C, 45, 0, Math.PI * 2); ctx.stroke()
      ctx.strokeStyle = 'rgba(127,223,239,0.6)'; ctx.lineWidth = 1.4
      ctx.beginPath(); ctx.arc(C, C, 38, 0, Math.PI * 2); ctx.stroke()
      // ticks N/E/S/W
      ctx.strokeStyle = 'rgba(234,252,255,0.92)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'
      for (let i = 0; i < 4; i++) {
        ctx.save(); ctx.translate(C, C); ctx.rotate((i * Math.PI) / 2)
        ctx.beginPath(); ctx.moveTo(0, -41); ctx.lineTo(0, -35); ctx.stroke(); ctx.restore()
      }
      // rose needle
      ctx.fillStyle = 'rgba(127,223,239,0.5)'
      ctx.beginPath(); ctx.moveTo(50, 20); ctx.lineTo(57, 50); ctx.lineTo(50, 80); ctx.lineTo(43, 50); ctx.closePath(); ctx.fill()
      // gold growth arrow
      ctx.strokeStyle = gold; ctx.lineWidth = 3.6; ctx.lineJoin = 'round'
      ctx.beginPath(); ctx.moveTo(31, 60); ctx.lineTo(44, 50); ctx.lineTo(52, 55); ctx.lineTo(68, 33); ctx.stroke()
      ctx.fillStyle = gold
      ctx.beginPath(); ctx.moveTo(60, 31); ctx.lineTo(70, 30); ctx.lineTo(69, 40); ctx.closePath(); ctx.fill()
      // hub + dollar
      ctx.fillStyle = tealDeep; ctx.strokeStyle = goldDeep; ctx.lineWidth = 1.6
      ctx.beginPath(); ctx.arc(C, C, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
      ctx.fillStyle = gold; ctx.font = '700 20px "Space Grotesk", sans-serif'
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
      ctx.fillText('$', 50, 51)
      ctx.restore()
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y)
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r)
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath()
    }

    const specs = [
      { name: 'icon-192.png', size: 192, maskable: false },
      { name: 'icon-512.png', size: 512, maskable: false },
      { name: 'icon-maskable-192.png', size: 192, maskable: true },
      { name: 'icon-maskable-512.png', size: 512, maskable: true },
    ]
    const tiles = document.getElementById('tiles')
    const canvases = specs.map((spec) => {
      const c = document.createElement('canvas'); c.width = spec.size; c.height = spec.size
      draw(c.getContext('2d'), spec.size, spec.maskable)
      const tile = document.createElement('div'); tile.className = 'tile'
      const view = document.createElement('canvas'); view.width = 120; view.height = 120
      view.getContext('2d').drawImage(c, 0, 0, 120, 120)
      tile.appendChild(view)
      const label = document.createElement('div'); label.textContent = spec.name
      tile.appendChild(label); tiles.appendChild(tile)
      return { c, spec }
    })
    document.getElementById('dl').addEventListener('click', () => {
      canvases.forEach(({ c, spec }) => c.toBlob((blob) => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = spec.name; a.click()
      }, 'image/png'))
    })
  </script>
</body>
</html>
